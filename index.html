<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#2E6FE0">
<meta name="description" content="脑梗康复助手：面向脑梗恢复期患者和家属的家庭康复工具。康复训练、血压记录、用药提醒、健康知识，数据仅保存在本机。">
<title>脑梗康复助手</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="app-header">
  <div class="header-inner">
    <div class="header-title">
      <span class="header-logo">🌱</span>
      <span id="header-app-name">脑梗康复助手</span>
    </div>
    <div class="header-actions">
      <button id="btn-settings" class="btn-icon" aria-label="设置">⚙️<span class="btn-icon-label">设置</span></button>
      <button id="btn-emergency" class="btn-emergency" aria-label="紧急情况">🚨 急救</button>
    </div>
  </div>
</header>

<main id="view" class="view-container" aria-live="polite"></main>

<nav class="bottom-nav" aria-label="主导航">
  <button class="nav-item active" data-view="today"><span class="nav-icon">🏠</span><span>今日</span></button>
  <button class="nav-item" data-view="train"><span class="nav-icon">💪</span><span>训练</span></button>
  <button class="nav-item" data-view="records"><span class="nav-icon">📈</span><span>记录</span></button>
  <button class="nav-item" data-view="meds"><span class="nav-icon">💊</span><span>用药</span></button>
  <button class="nav-item" data-view="learn"><span class="nav-icon">📚</span><span>知识</span></button>
</nav>

<div id="modal-root"></div>
<div id="toast" class="toast" role="status"></div>

<script src="js/data-exercises.js"></script>
<script src="js/data-articles.js"></script>
<script src="js/storage.js"></script>
<script src="js/charts.js"></script>
<script src="js/games.js"></script>
<script src="js/app.js"></script>
</body>
</html>
